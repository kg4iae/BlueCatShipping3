name: Deploy to TrueNAS Scale

on:
  push:
    branches: [ "main" ]  # Triggers on every push to the main branch

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bluecatshippingapp

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.actor }}/bluecatshippingapp:latest

      - name: Deploy to TrueNAS Scale
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.TRUENAS_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "bluecatshippingapp" \
            https://${{ secrets.TRUENAS_HOST }}/api/v2.0/app/redeploy
